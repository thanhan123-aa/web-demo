<style>
    
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
        font-family: 'Arial', sans-serif;
        background: #dbb240;
        color: #333;
        min-height: 100vh;
    }

    
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 50px;
        background: #1e352d;
        color: #fff;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 28px; }
    header button {
        padding: 8px 18px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background: #f39c12;
        color: #fff;
        transition: 0.3s;
    }
    header button:hover { background: #e67e22; }

    
    .container {
        display: flex;
        flex-wrap: wrap;
        padding: 30px 50px;
        gap: 50px;
    }

    
    .the {
        flex: 1 1 600px; 
        display: grid;
        grid-template-columns: repeat(3, 150px);
        gap: 25px 40px; 
    }

    .item {
        width: 150px;
        border: 5px solid #000;
        border-radius: 15px;
        background: #fff;
        text-align: center;
        transition: 0.3s;
        overflow: hidden;
        cursor: pointer;
    }
    .item img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        transition: 0.3s;
    }
    .item:hover img { transform: scale(1.1); }
    .item:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.3); border-radius: 15px; }
    .item a {
        display: block;
        padding: 10px 5px;
        text-decoration: none;
        font-weight: bold;
        color: #333;
        transition: 0.3s;
    }
    .item a:hover { color: #f39c12; }

    
    
</style>
</head>
